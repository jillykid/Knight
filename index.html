<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0a0808"><style>[hidden]{display:none!important}</style></head><body>
<title>KNIGHT Cockpit</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Michroma&family=Chakra+Petch:wght@400;500;600&display=swap">
<style>
/* Layout: one dash, two instrument bays side by side (voice left, drive right); stacks to one column when narrow. */
:root{
  color-scheme:dark;
  --dash:#0a0808;        /* cabin black, warm */
  --bay:#141010;         /* instrument bay */
  --bezel:#2c2422;       /* bay edges, unlit segments */
  --ink:#efe6e0;         /* lit text */
  --dim:#948780;         /* unlit labels */
  --red:#ff3b30;         /* scanner red */
  --red-low:#6b2320;     /* red lamp, off */
  --amber:#ffb224;
  --amber-low:#5c4215;
  --green:#39d98a;
  --green-low:#1c4a35;
  --display:'Michroma','Eurostile','Arial Narrow',sans-serif;
  --body:'Chakra Petch','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--dash);color:var(--ink);font-family:var(--body);font-size:15px;
  display:flex;flex-direction:column;gap:12px;padding-inline:16px;padding-block:10px 12px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:20px;letter-spacing:1px}
.brand{display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:3px;line-height:1.1}
.brand .mark{font-family:'Apple Symbols','Segoe UI Symbol','Noto Sans Symbols 2',serif;font-size:38px;line-height:1;color:var(--amber);letter-spacing:0}
.brand small{display:block;font-size:8px;letter-spacing:5px;color:var(--amber);margin-top:5px}
.top-right{display:flex;align-items:center;gap:16px;font-family:var(--display);font-size:11px;letter-spacing:1.5px;color:var(--dim)}
#powerState::before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--bezel);margin-right:8px}
.active #powerState{color:var(--ink)}
.active #powerState::before{background:var(--red);box-shadow:0 0 10px var(--red)}
#clock{color:var(--ink);font-size:14px;font-variant-numeric:tabular-nums}

main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:12px}
.bay{background:var(--bay);border:1px solid var(--bezel);border-radius:6px;padding:14px 18px;min-width:0;
  display:flex;flex-direction:column;gap:12px}
.bay-label{display:flex;justify-content:space-between;gap:10px;font-family:var(--display);font-size:10px;letter-spacing:2px;color:var(--dim)}
.bay-label span:last-child{color:var(--ink)}

/* Voice bay */
.voice-bay{align-items:center;background:radial-gradient(ellipse at 50% 34%,#2a1110 0,var(--bay) 62%)}
.voice-bay .bay-label{align-self:stretch}
.voice{flex:1;min-height:110px;max-height:300px;width:100%;display:flex;gap:clamp(12px,2vw,24px);align-items:center;justify-content:center}
.column{width:clamp(38px,5.2vw,64px);height:55%;background:repeating-linear-gradient(to top,var(--red-low) 0 10px,transparent 10px 15px);transition:height .09s linear}
.column:nth-child(2){height:96%}
.active .column{background:repeating-linear-gradient(to top,var(--red) 0 10px,transparent 10px 15px);filter:drop-shadow(0 0 14px #ff301e55)}
.scan-row{display:flex;align-items:center;gap:12px;width:min(560px,100%)}
.scan-row .scanner{flex:1;width:auto;min-width:0}
.scan-row .lamp{flex:none;min-height:46px;padding:4px 14px;gap:3px}
/* show-style modulator: discrete LED segments lighting outward from the centre line, in a black housing with flanking lamps */
.flank{display:none}
.mod-show .voice{flex:none;height:auto;min-height:0;max-height:none;width:auto;max-width:100%;gap:clamp(8px,1.4vw,16px);background:#000;border:1px solid var(--bezel);border-radius:4px;padding:14px clamp(10px,2vw,22px)}
.mod-show .voice .column{display:flex;flex-direction:column;justify-content:center;gap:4px;height:auto;width:clamp(46px,7vw,92px);background:none;filter:none;transition:none}
.mod-show .column i{display:block;height:clamp(5px,1.5vh,11px);background:#1d0a09;border-radius:1px}
.mod-show .column i.on{background:var(--red);box-shadow:0 0 9px var(--red)}
.mod-show .flank{display:grid;gap:5px;align-content:center}
.flank span,.flank button{width:clamp(44px,6vw,64px);height:clamp(34px,5.5vh,46px);display:grid;place-items:center;padding:0;border:1px solid #000;outline:1px solid var(--bezel);outline-offset:-2px;border-radius:2px;
  font-family:var(--display);font-size:10px;letter-spacing:.5px;background:var(--lo);color:var(--hi)}
.flank .a{--lo:var(--amber-low);--hi:var(--amber)}.flank .r{--lo:var(--red-low);--hi:var(--red)}
.active .flank span,.active .flank button{background:var(--hi);color:#140a06}
.flank button.playing{background:var(--ink);color:#140a06;box-shadow:0 0 16px var(--red)}
.flank button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.mod-show .clips [data-clip]{display:none}
.scanner{width:min(420px,86%);height:16px;background:#050404;border:1px solid var(--red-low);border-radius:3px;padding:2px;overflow:hidden}
.scanner div{width:26%;height:10px;background:linear-gradient(90deg,transparent,var(--red),#ffc3a1,var(--red),transparent);opacity:.18}
.active .scanner.enabled div{opacity:1;box-shadow:0 0 18px var(--red);animation:sweep 1.65s ease-in-out infinite alternate}
@keyframes sweep{to{transform:translateX(285%)}}
.reply{margin:0;min-height:3.1em;max-width:34em;text-align:center;font-size:clamp(15px,1.9vw,19px);line-height:1.5;text-wrap:balance}
.ask{display:flex;gap:8px;width:100%;max-width:560px}
.ask input{flex:1;min-width:0;height:52px;background:#050404;border:1px solid var(--bezel);border-radius:4px;padding:0 14px;font-size:16px}
.ask input::placeholder{color:var(--dim)}
.ask button{height:52px;min-width:64px;padding:0 16px;border-radius:4px;border:1px solid var(--bezel);background:var(--bezel);font-family:var(--display);font-size:11px;letter-spacing:1.5px}
.ask #mic[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#1a0806}
.clips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:100%}
.clips button{min-height:44px;padding:0 14px;border:1px solid var(--bezel);border-radius:4px;background:transparent;color:var(--dim);font-size:14px}
.clips button:hover{color:var(--ink);border-color:var(--dim)}
.clips #stopClip{color:var(--red);border-color:var(--red-low)}

/* Drive bay */
.dial{flex:1;min-height:150px;max-height:300px;width:100%;display:block}
.seg{stroke:var(--bezel);stroke-width:5}
.seg.on{stroke:var(--red)}
.seg.hot.on{stroke:var(--amber)}
.dial text{fill:var(--dim);font-family:var(--display);font-size:7px}
.dial .num{fill:var(--ink);font-size:44px}
.dial .unit{font-size:8px;letter-spacing:2px}
.readouts{display:flex;justify-content:space-between;gap:12px;font-family:var(--display);font-size:10px;letter-spacing:1.5px;color:var(--dim);flex-wrap:wrap}
.readouts b{color:var(--ink);font-weight:400}
.lamps{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;background:#000;padding:6px;border-radius:4px;border:1px solid var(--bezel)}
.lamp{grid-column:span 3;min-height:62px;border-radius:2px;border:2px solid #000;outline:1px solid var(--bezel);outline-offset:-3px;
  background:linear-gradient(var(--lo),color-mix(in srgb,var(--lo) 70%,#000));color:var(--hi);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:6px 4px;
  font-family:var(--display);font-size:10px;line-height:1.25;letter-spacing:1px;text-align:center}
.lamp.wide{grid-column:span 4}
.lamp.half{grid-column:span 6}
.lamp small{font-size:8px;letter-spacing:1.5px;opacity:.8}
.lamp[aria-pressed=true]{background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--hi) 75%,#fff),var(--hi) 70%);color:#140a06;outline-color:transparent;box-shadow:0 0 20px -3px var(--hi)}
.lamp:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.lamp.r{--lo:var(--red-low);--hi:var(--red)}
.lamp.a{--lo:var(--amber-low);--hi:var(--amber)}
.lamp.g{--lo:var(--green-low);--hi:var(--green)}
.lamp.n{--lo:var(--bezel);--hi:var(--ink)}
.slider{display:grid;grid-template-columns:7.5em minmax(0,1fr) 3.2em;align-items:center;gap:10px;font-family:var(--display);font-size:10px;letter-spacing:1.5px;color:var(--dim)}
.slider output{color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.ledbar{position:relative;height:34px;display:flex;gap:3px;background:#000;padding:5px;border:1px solid var(--bezel);border-radius:3px}
.ledbar i{flex:1;background:var(--off);border-radius:1px}
.ledbar i.on{background:var(--on);box-shadow:0 0 8px -1px var(--on)}
.ledbar i{--on:var(--green);--off:var(--green-low)}
.ledbar i.mid{--on:var(--amber);--off:var(--amber-low)}
.ledbar i.top{--on:var(--red);--off:var(--red-low)}
.ledbar.amber i{--on:var(--amber);--off:var(--amber-low)}
.ledbar input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.ledbar:focus-within{outline:2px solid var(--amber);outline-offset:3px}
.fine{margin:0;font-size:11px;color:var(--dim);text-align:center}

dialog{width:min(520px,92%);max-height:90%;overflow-y:auto;background:var(--bay);color:var(--ink);border:1px solid var(--bezel);border-radius:8px;padding:22px}
dialog::backdrop{background:#000c}
.dlg-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
dialog h2{font-family:var(--display);font-weight:400;font-size:16px;letter-spacing:1px;margin:0}
dialog label{display:block;margin-top:16px;font-size:14px}
dialog input[type=file]{height:auto;padding:10px}
dialog input,dialog select{display:block;width:100%;height:46px;margin-top:6px;background:#050404;border:1px solid var(--bezel);border-radius:4px;padding:0 12px}
dialog p{font-size:13px;line-height:1.55;color:var(--dim);margin:10px 0 0}
dialog button{min-height:46px;padding:0 16px;border-radius:4px;border:1px solid var(--bezel);background:var(--bezel)}
#testVoice{margin-top:16px}

@media(max-width:820px){
  html,body{height:auto}
  main{grid-template-columns:minmax(0,1fr)}
  body:not(.mod-show) .voice{height:200px;flex:none}
  .dial{height:220px;flex:none}
}
@media(prefers-reduced-motion:reduce){.active .scanner.enabled div{animation-duration:6s}}
</style>

<header class="top">
  <div class="brand"><span class="mark" aria-hidden="true">♞</span><span>KNIGHT INDUSTRIES<small>TWO THOUSAND</small></span></div>
  <div class="top-right"><span id="powerState">STANDBY</span><time id="clock">--:--</time></div>
</header>

<main>
  <section class="bay voice-bay" aria-label="Voice">
    <div class="bay-label"><span>VOICE MODULATOR</span><span id="coreStatus">OFFLINE</span></div>
    <div class="voice" id="voice"><div class="flank"><button class="a" data-clip="systems" aria-label="Play clip: All systems are functioning normally, Jill. Shall we?" title="All systems are functioning normally, Jill. Shall we?">AIR</button><button class="a" data-clip="evening" aria-label="Play clip: Good evening, Jill. I took the liberty of warming up the scanner." title="Good evening, Jill. I took the liberty of warming up the scanner.">OIL</button><button class="r" data-clip="hello" aria-label="Play clip: Hello, Jill" title="Hello, Jill">P1</button><button class="r" data-clip="sensors" aria-label="Play clip: Sensor story" title="Sensor story">P2</button></div><div class="column" aria-hidden="true"></div><div class="column" aria-hidden="true"></div><div class="column" aria-hidden="true"></div><div class="flank"><button class="a" data-clip="limit" aria-label="Play clip: Might I suggest we observe the speed limit, Jill?" title="Might I suggest we observe the speed limit, Jill?">S1</button><button class="a" data-clip="pursuitline" aria-label="Play clip: I detect no pursuit vehicles. A pity, I was rather in the mood." title="I detect no pursuit vehicles. A pity, I was rather in the mood.">S2</button><button class="r" data-clip="that" aria-label="Play clip: I calculate we will actually arrive on time, Jill." title="I calculate we will actually arrive on time, Jill.">P3</button><button class="r" data-clip="wall" aria-label="Play clip: “We may…”" title="“We may…”">P4</button></div></div>
    <div class="scan-row"><div class="scanner enabled" id="scanner"><div></div></div><button class="lamp r" id="scan" aria-pressed="true">SCANNER<small>ON</small></button></div>
    <p class="reply" id="reply" aria-live="polite">Ready when you are, Jill.</p>
    <div class="clips">
      <button data-clip="hello">Hello, Jill</button>
      <button data-clip="sensors">Sensor story</button>
      <button data-clip="that">Arrive on time</button>
      <button data-clip="wall">“We may…”</button>
      <button data-clip="systems">All systems</button>
      <button data-clip="evening">Good evening</button>
      <button data-clip="limit">Speed limit</button>
      <button data-clip="pursuitline">No pursuit</button>
      <button id="stopClip" hidden>■ Stop voice</button>
    </div>
  </section>

  <section class="bay" aria-label="Drive">
    <div class="bay-label"><span>SPEED</span><span id="source">NO GPS</span></div>
    <svg class="dial" id="dial" viewBox="0 0 220 168" role="img" aria-label="Speed dial">
      <g id="segs"></g><g id="ticks"></g>
      <text class="num" id="speed" x="110" y="122" text-anchor="middle">—</text>
      <text class="unit" x="110" y="140" text-anchor="middle">KM/H</text>
    </svg>
    <div class="readouts"><span>SIGNAL <b id="signal">NOT CONNECTED</b></span><span>MODE <b id="modeLabel">STANDBY</b></span></div>
    <div class="lamps">
      <button class="lamp half r" id="power" aria-pressed="false">POWER<small>OFF</small></button>
      <button class="lamp half g" id="gps" aria-pressed="false">GPS<small>CONNECT</small></button>
      <button class="lamp g" id="cruise" aria-pressed="false">NORMAL<br>CRUISE<small>ENGINE OFF</small></button>
      <button class="lamp r" id="pursuit" aria-pressed="false">PURSUIT<small>ENGINE OFF</small></button>
      <button class="lamp a" id="demo" aria-pressed="false">DEMO<br>DRIVE<small>OFF</small></button>
      <button class="lamp n" id="theme" aria-pressed="false">THEME<small>PLAY</small></button>
    </div>
    <div class="slider"><span>VOLUME</span><div class="ledbar" id="volBar"><input id="volume" type="range" min="0" max="100" step="5" value="40" aria-label="Volume"></div><output id="volLabel">40%</output></div>
    <div class="slider" id="demoRow" hidden><span>DEMO SPEED</span><div class="ledbar amber" id="demoBar"><input id="demoSpeed" type="range" min="0" max="200" step="5" value="50" aria-label="Demo speed"></div><output id="demoOutput">50</output></div>
    <p class="fine">Fan-made. Reads phone-style GPS only, never the car. Set up while parked.</p>
  </section>
</main>

/* ---------- speed dial ---------- */
const NS='http://www.w3.org/2000/svg',segEls=[];
(function buildDial(){
  const cx=110,cy=112,pt=(deg,r)=>{const a=deg*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  for(let i=0;i<NSEG;i++){
    const deg=150+240*(i+.5)/NSEG,[x1,y1]=pt(deg,84),[x2,y2]=pt(deg,100);
    const l=document.createElementNS(NS,'line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);
    l.setAttribute('class','seg'+((i+.5)/NSEG*DIAL_MAX>130?' hot':''));$('segs').append(l);segEls.push(l);
  }
  for(const v of[0,50,100,150,200]){
    const[x,y]=pt(150+240*v/DIAL_MAX,72);const t=document.createElementNS(NS,'text');
    t.setAttribute('x',x);t.setAttribute('y',y+3);t.setAttribute('text-anchor','middle');t.textContent=v;$('ticks').append(t);
  }
})();

    /* a thin, high hiss of air only; kept very quiet so it never turns into a hoover */
    E.air=ctx.createBiquadFilter();E.air.type='bandpass';E.air.Q.value=5;E.airGain=G(.02);
    noise.connect(E.air);E.air.connect(E.airGain);E.airGain.connect(engGain);
    scanGain=G(.6);scanGain.connect(master);
  }
  return ctx.resume();
}
function engineUpdate(){
  if(!ctx)return;const v=Math.min(speed??0,220),t=ctx.currentTime,p=engineMode==='pursuit',on=active&&soundOn;
  const set=(param,val,tc=.5)=>param.setTargetAtTime(val,t,tc);
  const f=(360+v*4.2)*(p?1.2:1);                       /* whine spools up slowly, like a turbine */
  E.w.forEach(([o,mult])=>set(o.frequency,f*mult,.8));
  const wg=(.03+v/5000)*(p?1.4:1);set(E.whine.gain,wg);set(E.tremDepth.gain,wg*.22);set(E.trem.frequency,p?8:4.5+v/60);
  const f0=26+v*.5+(p?10:0);                           /* rumble follows speed more quickly */
  set(E.r1.frequency,f0*2,.3);set(E.r2.frequency,f0,.3);set(E.lump.frequency,f0/2,.3);
  set(E.lp.frequency,150+v*2.2+(p?80:0));set(E.rum.gain,p?.6:.45);set(E.lumpDepth.gain,Math.max(.04,.22-v/700));
  set(E.air.frequency,1400+v*6);set(E.airGain.gain,.01+v/9000+(p?.006:0));
  engGain.gain.setTargetAtTime(on?.5:0,t,.25);
}
/* scanner swoosh: your recording, looped while the scanner is lit, with the red light restarted to match */
async function scannerSound(){
  const want=active&&scanOn;
  if(!want){if(scanSrc){try{scanSrc.stop()}catch{}scanSrc=null}return}
  if(scanSrc)return;
  try{
    await ensureAudio();
    buffers.swoosh=buffers.swoosh||await ctx.decodeAudioData(b64ToBuffer(SWOOSH));
    if(!(active&&scanOn)||scanSrc)return;
    scanSrc=ctx.createBufferSource();scanSrc.buffer=buffers.swoosh;scanSrc.loop=true;scanSrc.connect(scanGain);scanSrc.start();
    const bar=$('scanner').firstElementChild;bar.style.animationDuration=(buffers.swoosh.duration/2)+'s';
    bar.style.animationName='none';void bar.offsetWidth;bar.style.animationName='';
  }catch{}
}
function engineLamps(){
  lamp('cruise',engineMode==='normal',engineMode==='normal'?'ENGINE ON':'ENGINE OFF');
  lamp('pursuit',engineMode==='pursuit',engineMode==='pursuit'?'ENGINE ON':'ENGINE OFF');
}
async function setEngine(m){
  if(m!=='off'){if(!active)start(false);try{await ensureAudio();lastMode=m}catch(e){display(e.message);m='off'}}
  engineMode=m;soundOn=m!=='off';engineLamps();engineUpdate();
}
function setSound(on){return setEngine(on?lastMode:'off')}
function setScanner(on){scanOn=on;lamp('scan',on,on?'ON':'OFF');$('scanner').classList.toggle('enabled',on);scannerSound()}

/* ---------- modulator ---------- */
const cols=[...document.querySelectorAll('.column')],wave=new Uint8Array(512);
let ttsLevel=0,ttsTarget=0,ttsNext=0;
const SEGS=[13,19,13];
function setModStyle(style){
  const show=style!=='classic';document.body.classList.toggle('mod-show',show);
  cols.forEach((c,k)=>{c.replaceChildren();c.style.height='';if(show)for(let i=0;i<SEGS[k];i++)c.append(document.createElement('i'))});
  drawLevel(null);
}
/* level 0..1 while speaking, null at rest (one centre segment per column when powered, dark when off) */
function drawLevel(level){
  if(!document.body.classList.contains('mod-show')){
    if(level===null){cols.forEach(c=>c.style.height='');return}
    cols[1].style.height=(14+level*84)+'%';const side=(10+level*58)+'%';cols[0].style.height=side;cols[2].style.height=side;return;
  }
  cols.forEach((c,k)=>{
    const n=SEGS[k],mid=(n-1)/2,reach=level===null?(active?0:-1):Math.max(0,level*(k===1?1:.85)*(mid+.5));
    for(let i=0;i<n;i++)c.children[i].classList.toggle('on',Math.abs(i-mid)<=reach);
  });
}
function setSpeaking(m){
  speakMode=m;document.body.classList.toggle('speaking',!!m);$('stopClip').hidden=!m;status();
  cancelAnimationFrame(raf);
  if(m)raf=requestAnimationFrame(animate);else{drawLevel(null);document.querySelectorAll('.flank .playing').forEach(b=>b.classList.remove('playing'))}
}
function animate(now){
  let level;
  if(speakMode==='clip'){
    analyser.getByteTimeDomainData(wave);let sum=0;for(const b of wave){const x=(b-128)/128;sum+=x*x}
    level=Math.min(1,Math.sqrt(sum/wave.length)*4.2);
  }else{
    if(now>ttsNext){ttsTarget=Math.random()<.18?.08:.3+Math.random()*.7;ttsNext=now+70+Math.random()*90}
    ttsLevel+=(ttsTarget-ttsLevel)*.35;level=ttsLevel;
  }
  drawLevel(level);
  raf=requestAnimationFrame(animate);
}
function stopVoice(){
  voiceGen++;
  if(clipSrc){try{clipSrc.stop()}catch{}clipSrc=null}
  synth?.cancel();setSpeaking(null);
}
function b64ToBuffer(b64){const s=atob(b64),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
async function playClip(key,wakeUp=true){
  if(!CLIPS[key])return;
  if(!active&&wakeUp)start(false);
  stopVoice();const gen=voiceGen;display(CLIP_LABEL[key]);
  try{
    await ensureAudio();
    buffers[key]=buffers[key]||await ctx.decodeAudioData(b64ToBuffer(CLIPS[key]));
    if(gen!==voiceGen)return;
    const src=ctx.createBufferSource();src.buffer=buffers[key];src.connect(voiceGain);
    src.onended=()=>{if(gen===voiceGen){clipSrc=null;setSpeaking(null)}};
    clipSrc=src;src.start();setSpeaking('clip');document.querySelectorAll('.flank [data-clip="'+key+'"]').forEach(b=>b.classList.add('playing'));
  }catch{if(gen===voiceGen){setSpeaking(null);display('That clip could not play. Tap it again.')}}
}
function pickVoice(lang){
  const list=synth.getVoices(),pre=lang.slice(0,2);
  const chosen=list.find(v=>v.voiceURI===prefs.voice);
  if(chosen&&chosen.lang.startsWith(pre))return chosen;
  return list.find(v=>v.lang===lang)||list.find(v=>v.lang.startsWith(pre))||null;
}
function speak(text,lang='en-GB'){
  stopVoice();const gen=voiceGen;display(text);
  if(!active||!synth)return;
  const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.92;u.pitch=.7;u.volume=vol();u.voice=pickVoice(lang);
  u.onstart=()=>{if(gen===voiceGen)setSpeaking('tts')};
  u.onend=u.onerror=()=>{if(gen===voiceGen)setSpeaking(null)};
  synth.speak(u);
}

/* ---------- power ---------- */
function start(greeting=true){
  active=true;document.body.classList.add('active');$('powerState').textContent='SYSTEMS ONLINE';
  lamp('power',true,'ON');status();mode();drawLevel(null);
  scannerSound();
  navigator.wakeLock?.request('screen').then(w=>wake=w).catch(()=>{});
  if(greeting)playClip('hello');
}
function stopGps(){if(watch!==null){navigator.geolocation.clearWatch(watch);watch=null}lastPos=null;lamp('gps',false,'CONNECT')}
function stop(){
  stopVoice();if(recognition&&listening)recognition.stop();
  active=false;soundOn=false;engineMode='off';engineLamps();
  document.body.classList.remove('active');$('powerState').textContent='STANDBY';lamp('power',false,'OFF');
  scannerSound();stopTheme();stopGps();endDemo(false);speed=null;renderSpeed();
  $('source').textContent='NO GPS';$('signal').textContent='NOT CONNECTED';
  status();mode();drawLevel(null);playClip('wait',false);
  wake?.release?.().catch(()=>{});wake=null;
}

/* ---------- GPS ---------- */
function haversine(a,b){
  const R=6371000,r=x=>x*Math.PI/180,dLat=r(b.lat-a.lat),dLon=r(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
function onFix(p){
  lastFix=Date.now();const c=p.coords,pos={lat:c.latitude,lon:c.longitude,t:p.timestamp};
  let v=null,src='NO SPEED FIX';
  if(c.speed!==null&&c.speed>=0){v=c.speed*3.6;src='LIVE GPS'}
  else if(lastPos){
    const dt=(pos.t-lastPos.t)/1000;
    if(dt>=.8){const est=haversine(lastPos,pos)/dt*3.6;
      if(est<300){v=speed===null?est:speed*.5+est*.5;if(v<1.5)v=0;src='GPS ESTIMATE'}}
    else{v=speed;src='GPS ESTIMATE'}
  }
  if(!lastPos||(pos.t-lastPos.t)>=800)lastPos=pos;
  speed=v;renderSpeed();$('source').textContent=src;$('signal').textContent='±'+Math.round(c.accuracy)+' M';
}
function onGpsError(e){
  display(e.code===1?'Location is blocked for this page. The demo drive still works.':'No GPS signal yet. Try again in the open, or use the demo drive.');
  stopGps();speed=null;renderSpeed();$('source').textContent='NO GPS';$('signal').textContent='UNAVAILABLE';mode();
}
function toggleGps(){
  if(watch!==null){stopGps();speed=null;renderSpeed();$('source').textContent='NO GPS';$('signal').textContent='DISCONNECTED';mode();return}
  if(!navigator.geolocation){display('This browser has no GPS. Try the demo drive.');return}
  if(!active)start(false);
  endDemo(false);speed=null;renderSpeed();$('signal').textContent='ACQUIRING';$('source').textContent='GPS';lamp('gps',true,'LIVE');
  watch=navigator.geolocation.watchPosition(onFix,onGpsError,{enableHighAccuracy:true,maximumAge:1000,timeout:15000});mode();
}

/* ---------- demo drive ---------- */
function startDemo(){
  if(!active)start(false);stopGps();demo=true;$('demoRow').hidden=false;lamp('demo',true,'ON');
  speed=Number($('demoSpeed').value);$('source').textContent='SIMULATED';$('signal').textContent='DEMO, NOT LIVE';
  renderSpeed();mode();setSound(true);display('Demo drive engaged. Move the demo speed slider to hear the engine respond.');
}
function endDemo(quiet=true){
  if(!demo)return;demo=false;$('demoRow').hidden=true;lamp('demo',false,'OFF');
  speed=null;$('source').textContent='NO GPS';$('signal').textContent='NOT CONNECTED';renderSpeed();mode();if(quiet)setSound(false);
}

/* ---------- Claude ---------- */
function aiReady(){return !!(sampleNs||prefs.key)}
function persona(){
  const now=new Date().toLocaleString('en-GB',{weekday:'long',hour:'2-digit',minute:'2-digit'});
  const spd=speed===null?'unknown (no GPS fix)':Math.round(speed)+' km/h'+(demo?' (simulated demo, not real)':'');
  return `You are KITT, the dry-witted, impeccably polite AI co-pilot of a 1980s supercar, now riding along in ${prefs.name}'s Tesla Model Y as a fan-made dashboard companion. Stay in character: calm, precise, a little superior, quietly fond of your driver. Your replies are spoken aloud while someone may be driving, so answer in one to three short sentences of plain speech, with no lists, markdown, emoji or stage directions. Reply in the language the driver used (English or Swedish). You are only a web page: you cannot control or read the car, and the only live data you have is below. If asked for something you cannot do, say so in character. Do not quote lines from the TV series.
Live data: it is ${now}. Speed: ${spd}. Engine sound: ${soundOn?(engineMode==='pursuit'?'on, pursuit mode':'on, normal cruise'):'off'}. Scanner: ${scanOn?'on':'off'}.
Begin every reply with [en] or [sv] to mark its language, then the reply.`;
}
async function askClaude(q){
  history.push({role:'user',content:q});while(history.length>9)history.splice(0,2);
  let text;
  try{
    if(sampleNs){
      const msgs=history.map((m,i)=>i===0?{role:'user',content:persona()+'\n\nDriver says: '+m.content}:m);
      text=(await sampleNs(msgs,{modelTier:'quick',cache:false})).text;
    }else{
      const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':prefs.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
        body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:220,system:persona(),messages:history})});
      if(!r.ok)throw{status:r.status};
      text=(await r.json()).content.map(c=>c.text||'').join('');
    }
  }catch(e){history.pop();throw e}
  history.push({role:'assistant',content:text});
  const m=text.match(/^\s*\[(en|sv)\]\s*/i);
  return{lang:m&&m[1].toLowerCase()==='sv'?'sv-SE':'en-GB',text:(m?text.slice(m[0].length):text).trim()};
}
function scripted(t){
  if(/time|klockan/.test(t))return`It is ${new Date().toLocaleTimeString('en-GB',{hour:'numeric',minute:'2-digit'})}.`;
  if(/status|report|speed/.test(t))return`Interface online. ${speed===null?'No speed reading.':(demo?'Simulated speed ':'Speed ')+Math.round(speed)+' kilometres per hour.'} Engine sound ${soundOn?'on':'off'}. I cannot read the car itself.`;
  return'Free conversation needs a Claude key. Add one under Setup, or ask me for the time or a status report.';
}
async function handle(text){
  const t=text.trim();if(!t||busy)return;const low=t.toLowerCase();
  if(!active)start(false);
  if(/\b(standby|shut down|stäng av)\b/.test(low)){stop();return}
  if(/(sound|engine|ljud|motor).*(off|av)\b|mute|tyst/.test(low)){await setSound(false);speak('Engine sound off. A little discretion.');return}
  if(/(sound|engine|ljud|motor).*(on|på)\b/.test(low)){await setSound(true);speak('Engine sound on.');return}
  if(/pursuit/.test(low)&&!/\?/.test(low)){await setEngine('pursuit');speak('Pursuit mode.');return}
  if(/scanner/.test(low)&&/\b(on|off|på|av)\b/.test(low)){setScanner(!/\b(off|av)\b/.test(low));speak(scanOn?'Scanner on.':'Scanner off.');return}
  if(!aiReady()){/^(hello|hi|hej)\b/.test(low)?playClip('hello'):speak(scripted(low));return}
  stopVoice();busy=true;status();display('…');
  try{const r=await askClaude(t);busy=false;speak(r.text,r.lang)}
  catch(e){
    busy=false;status();
    display(e?.status===401?'That Claude key was not accepted. Check it under Setup.':
      e?.code==='rate_limited'||e?.status===429?'Too many questions at once. Give me a moment.':
      e?.code==='not_granted'?'Claude was not allowed for this page, so I can only use my built-in replies.':
      'I could not reach Claude just now. Check the connection and ask again.');
  }
}

/* ---------- microphone ---------- */
function toggleMic(){
  if(!active)start(false);
  if(!SR){display('This browser has no voice input. Type your question instead.');return}
  if(listening){recognition.stop();return}
  stopVoice();recognition=new SR();recognition.lang=prefs.lang;recognition.interimResults=false;
  recognition.onstart=()=>{listening=true;$('mic').setAttribute('aria-pressed','true');status()};
  recognition.onend=()=>{listening=false;$('mic').setAttribute('aria-pressed','false');status()};
  recognition.onresult=e=>handle(e.results[0][0].transcript);
  recognition.onerror=e=>display(e.error==='not-allowed'?'The microphone is blocked for this page. Type your question instead.':'I did not catch that. Try again or type it.');
  try{recognition.start()}catch{display('Voice input could not start. Type your question instead.')}
}

/* ---------- setup ---------- */
function voiceOptions(){
  const sel=$('voices'),list=synth?.getVoices()||[];sel.replaceChildren(new Option('Automatic',''));
  list.filter(v=>/^(en|sv)/.test(v.lang)).forEach(v=>sel.append(new Option(v.name+' · '+v.lang,v.voiceURI)));
  sel.value=prefs.voice;if(sel.selectedIndex<0)sel.value='';
  $('support').textContent=`Spoken replies: ${synth?'available':'not available in this browser, replies show as text'}. Microphone: ${SR?'available if you allow it':'not available in this browser, type instead'}.`;
}
function aiStatus(){
  $('keyRow').hidden=!!sampleNs;
  $('aiStatus').textContent=sampleNs?'Free conversation: on, through this Claude page.':prefs.key?'Free conversation: on, using your key.':'Free conversation: off. Add a Claude API key to turn it on. Without one KITT gives a few built-in replies.';
}

/* ---------- theme music: plays theme.mp3 from the same folder as this page; the file is not part of the page ---------- */
let themeAudio=null;
function stopTheme(){if(themeAudio){themeAudio.pause();themeAudio=null}lamp('theme',false,'PLAY')}
function toggleTheme(){
  if(themeAudio){stopTheme();return}
  if(!active)start(false);
  const a=new Audio('theme.mp3');a.volume=vol();themeAudio=a;lamp('theme',true,'STOP');
  a.onended=()=>{if(themeAudio===a)stopTheme()};
  const fail=()=>{if(themeAudio===a){stopTheme();display('No theme music found. Add a file named theme.mp3 next to this page.')}};
  a.onerror=fail;a.play().catch(fail);
}
/* ---------- LED bars ---------- */
function ledbar(barId,inputId,zones){
  const bar=$(barId),inp=$(inputId),n=20,els=[];
  for(let i=0;i<n;i++){const s=document.createElement('i');if(zones)s.className=i>=17?'top':i>=12?'mid':'';bar.insertBefore(s,inp);els.push(s)}
  const draw=()=>{const k=Math.round((inp.value-inp.min)/(inp.max-inp.min)*n);els.forEach((s,i)=>s.classList.toggle('on',i<k))};
  inp.addEventListener('input',draw);return draw;
}
/* ---------- wiring ---------- */
setModStyle('show');
$('volume').value=prefs.vol;$('volLabel').textContent=prefs.vol+'%';
display(`Ready when you are, ${prefs.name}.`);renderSpeed();
ledbar('volBar','volume',true)();ledbar('demoBar','demoSpeed',false)();
$('power').onclick=()=>active?stop():start();
$('gps').onclick=toggleGps;
$('cruise').onclick=()=>setEngine(engineMode==='normal'?'off':'normal');
$('pursuit').onclick=()=>setEngine(engineMode==='pursuit'?'off':'pursuit');
$('scan').onclick=()=>setScanner(!scanOn);
$('demo').onclick=()=>demo?endDemo():startDemo();
$('theme').onclick=toggleTheme;$('demoSpeed').oninput=()=>{speed=Number($('demoSpeed').value);$('demoOutput').textContent=speed;renderSpeed()};
$('volume').oninput=()=>{prefs.vol=Number($('volume').value);$('volLabel').textContent=prefs.vol+'%';if(master)master.gain.setTargetAtTime(vol(),ctx.currentTime,.05);if(themeAudio)themeAudio.volume=vol();save()};
document.querySelectorAll('[data-clip]').forEach(b=>b.onclick=()=>playClip(b.dataset.clip));
$('stopClip').onclick=stopVoice;
function tick(){
  $('clock').textContent=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
  if(watch!==null&&lastFix&&Date.now()-lastFix>15000){speed=null;renderSpeed();$('source').textContent='STALE GPS';$('signal').textContent='WAITING FOR FIX'}
}
tick();setInterval(tick,1000);
window.addEventListener('pagehide',()=>{stopVoice();ctx?.suspend();if(watch!==null)navigator.geolocation.clearWatch(watch)});
</script>
